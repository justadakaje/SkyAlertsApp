[project]
name = "skyalerts-digest"
version = "0.1.0"
description = "Weekly Sky Alerts digest: event selection and rendering"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "httpx>=0.28,<0.29",
  # Postgres driver (binary wheels; no system libpq needed). Same driver the ingest job uses.
  "psycopg[binary]>=3.3,<3.4",
]

[dependency-groups]
dev = [
  "pytest>=9.2,<10",
  "ruff>=0.17.3,<0.18",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["skyalerts_digest"]

[tool.uv]
package = true

[tool.vercel]
entrypoint = "skyalerts_digest.web:app"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
