name: Explore ALeRCE

# Manual run of the Phase 0 exploration script. Runs on Actions because the
# agent workspace cannot reach *.alerce.online. Output: job summary + artifact
# with raw JSON samples (used as real-data test fixtures).

on:
  workflow_dispatch:
    inputs:
      survey:
        description: "Survey(s)"
        type: choice
        options: [both, ztf, lsst]
        default: both
      limit:
        description: "Objects per survey (max 100)"
        type: number
        default: 25

permissions:
  contents: read

jobs:
  explore:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ingest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: ingest/uv.lock
      - run: uv sync --frozen --no-dev
      - name: Run exploration
        env:
          SURVEY: ${{ inputs.survey }}
          LIMIT: ${{ inputs.limit }}
        run: |
          uv run python -m skyalerts_ingest.explore \
            --survey "$SURVEY" --limit "$LIMIT" \
            --out out/explore --markdown out/explore/summary.md
          cat out/explore/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: explore-${{ github.run_id }}
          path: ingest/out/explore/
          retention-days: 30
          if-no-files-found: warn
