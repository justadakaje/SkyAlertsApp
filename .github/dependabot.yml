# Version updates. Security updates are enabled separately (repo setting) and
# bypass the schedule. SLA per SPEC: security PRs merged <=7 days, critical <=48h.
version: 2
updates:
  - package-ecosystem: uv
    directory: /ingest
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [dependencies, lane:data]
    groups:
      python-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: uv
    directory: /db
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [dependencies, lane:database]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies, lane:devops]
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [dependencies, lane:frontend]
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    ignore:
      # TypeScript 7 is the native-compiler rewrite; adopt it deliberately, not via a bump.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      # Types track the pinned runtime (engines.node 26.x, CI and Vercel); bump with the runtime.
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
